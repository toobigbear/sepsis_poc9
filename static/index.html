<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#081217">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230b2028'/%3E%3Cpath d='M4 17h6l3-8 4 15 3-7h8' fill='none' stroke='%234bc7d3' stroke-width='2'/%3E%3C/svg%3E">
  <title>脓毒症智能预警与多模态推演工作站</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg class="svg-defs" aria-hidden="true"><defs>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
  <symbol id="i-patient" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M5 21v-3a7 7 0 0 1 14 0v3M4 11h3l2-3 2 6 2-4 2 2h5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5M12 17v.2"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m4 17 5-5 4 4 2-2 5 5"/></symbol>
  <symbol id="i-flow" viewBox="0 0 24 24"><circle cx="5" cy="5" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="12" cy="19" r="2"/><path d="M7 5h10M6 7l5 10M18 7l-5 10"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 8h8M8 12h8M8 16h5"/></symbol>
  <symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M6 11h3l2-4 2 7 2-3h3"/></symbol>
  <symbol id="i-audit" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 8a7 7 0 0 1 12-1l2 5M18 16a7 7 0 0 1-12 1l-2-5"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
</defs></svg>
<div id="login" class="login-shell">
  <section class="login-brand">
    <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
    <div class="eyebrow">SEPSIS CLINICAL INTELLIGENCE</div>
    <h1>脓毒症智能预警<br>与多模态推演工作站</h1>
    <p>连续监测 · 风险分层 · 多模态复核 · 干预路径推演</p>
    <div class="login-wave"><svg viewBox="0 0 800 100" preserveAspectRatio="none"><path d="M0 52h110l18-1 12-22 15 49 19-65 21 39h85l16-1 13-18 17 37 17-52 18 34h128l13-1 12-21 16 45 18-59 19 36h132l18-1 12-18 16 39 17-53 18 34h115"/></svg></div>
    <div class="login-foot"><span>临床数据一体化</span><span>本地安全计算</span><span>全程审计追踪</span></div>
  </section>
  <section class="login-panel">
    <form id="login-form" class="login-card">
      <div class="mobile-brand">SEPSIS ICU</div><h2>工作站登录</h2><p class="muted">请输入您的院内账户凭据</p>
      <label>账户<input name="username" autocomplete="username" required autofocus></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <div id="login-error" class="form-error"></div>
      <button class="btn primary wide" type="submit">进入工作站</button>
      <div class="login-security"><svg><use href="#i-audit"/></svg>会话经本地加密校验，操作全程留痕</div>
    </form>
  </section>
</div>
<div id="shell" class="app-shell hidden">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark small"><span></span><span></span><span></span><span></span></div><div><b>SEPSIS ICU</b><small>临床智能工作站</small></div></div>
    <nav id="nav">
      <button data-page="ward" class="active"><svg><use href="#i-grid"/></svg><span>病区总览</span></button>
      <button data-page="patient"><svg><use href="#i-patient"/></svg><span>患者工作台</span></button>
      <button data-page="alerts"><svg><use href="#i-alert"/></svg><span>预警中心</span><em id="alert-count">0</em></button>
      <button data-page="vision"><svg><use href="#i-image"/></svg><span>图像复核</span></button>
      <button data-page="simulation"><svg><use href="#i-flow"/></svg><span>干预推演</span></button>
      <button data-page="brief"><svg><use href="#i-note"/></svg><span>交接简报</span></button>
      <button data-page="devices"><svg><use href="#i-device"/></svg><span>设备与数据</span></button>
      <button data-page="quality"><svg><use href="#i-audit"/></svg><span>质控审计</span></button>
    </nav>
    <div class="sidebar-foot"><span class="status-dot"></span><div>本地服务运行中<small id="db-status">SQLite · 数据已连接</small></div></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button id="mobile-menu" class="icon-btn mobile-only"><svg><use href="#i-menu"/></svg></button>
      <div class="breadcrumb"><span>重症监护医学科</span><b id="page-title">病区总览</b></div>
      <div class="top-right"><span id="lm-status" class="system-pill checking"><i></i>模型服务检测中</span><time id="clock"></time><div class="user-wrap"><button id="user-button" class="user-button"><span id="user-avatar">医</span><div><b id="user-name"></b><small id="user-role"></small></div></button><div id="user-menu" class="user-menu hidden"><button id="open-system">系统管理</button><button id="logout">退出登录</button></div></div></div>
    </header>
    <div id="context-bar" class="context-bar hidden"><div><span class="label">当前患者</span><select id="patient-select"></select></div><div id="context-patient"></div><button id="refresh-page" class="btn ghost"><svg><use href="#i-refresh"/></svg>刷新</button></div>
    <section id="content" class="content"><div class="loading"><span></span>正在读取临床数据</div></section>
  </main>
</div>
<aside id="system-drawer" class="drawer hidden"><header><div><span class="eyebrow">SYSTEM ADMINISTRATION</span><h2>系统管理</h2></div><button class="icon-btn close-drawer"><svg><use href="#i-close"/></svg></button></header><div id="system-content" class="drawer-body"></div></aside><div id="drawer-mask" class="drawer-mask hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-card"><header><h3 id="modal-title"></h3><button class="icon-btn modal-close"><svg><use href="#i-close"/></svg></button></header><div id="modal-body"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body></html>
